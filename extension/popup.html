<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calreminder</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head>
<body><header><div class="brand"><span>✳</span> calreminder</div><button id="settings-toggle" class="plain" title="서버 설정">⚙</button></header>
<main>
  <section id="settings" class="panel hidden"><h2>서버 연결</h2><p>Calreminder 웹 앱의 주소를 입력하세요.</p><form id="server-form"><input id="server-url" type="url" placeholder="https://your-app.onrender.com" required><button class="primary" type="submit">저장</button></form></section>
  <section id="signed-out" class="center hidden"><div class="illustration">✦</div><h1>오늘의 일정을<br>가볍게 확인하세요.</h1><p>구글 계정으로 로그인하면 웹 앱의 일정과 완료 기록이 동기화됩니다.</p><button id="login" class="google-button"><svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.27 5.48-4.8 7.18l7.73 6C44.38 38.03 46.98 31.68 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.35 14.35 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.2A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.14 1.44-4.88 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Google로 로그인</button></section>
  <section id="calendar" class="hidden"><div class="summary"><div><span class="eyebrow" id="today"></span><h1>예정된 일정</h1><p id="source"></p></div><button id="refresh" class="plain" title="동기화">↻</button></div><div class="stats"><span id="pending-count"></span><button id="open-web" class="text-button">웹에서 보기 ↗</button></div><div id="items" class="items"></div><footer><button id="logout" class="text-button">로그아웃</button></footer></section>
  <p id="error" class="error hidden" role="status"></p>
</main></body></html>
